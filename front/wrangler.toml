name = "kurupiro"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# 本番環境用のService Bindings
[[services]]
binding = "API"
service = "kuru-piro-worker"

# Preview環境はHTTPでブランチ固有のWorkerにアクセスするため、Service Bindingは不要
# Worker URLのサブドメインを環境変数で設定
[vars]
WORKER_SUBDOMAIN = "ichipiro-explorer"
