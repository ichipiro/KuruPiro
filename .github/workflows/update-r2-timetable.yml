name: Update R2 Timetable

on:
  # D1 更新（03:00 JST = 18:00 UTC）の直後に実行
  schedule:
    - cron: "30 18 * * *" # 03:30 JST
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Download GTFS
        run: bash update-gtfs.sh

      - name: Generate static timetable JSON
        run: uv run python generate_static.py tmp/gtfs tmp/output

      - name: Upload to R2
        env:
          R2_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: kurpiro-timetable
        run: uv run python upload_to_r2.py tmp/output
