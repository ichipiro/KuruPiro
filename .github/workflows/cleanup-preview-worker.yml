name: Cleanup Preview Worker

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sanitize branch name
        id: sanitize
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          SANITIZED=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^-\|-$//g')
          echo "branch=$SANITIZED" >> $GITHUB_OUTPUT
          echo "worker_name=kuru-piro-worker-$SANITIZED" >> $GITHUB_OUTPUT

      - name: Delete Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd api
          # Delete the branch-specific worker
          pnpm wrangler delete --name ${{ steps.sanitize.outputs.worker_name }} --force || echo "Worker already deleted or not found"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const workerName = '${{ steps.sanitize.outputs.worker_name }}';
            const body = '### 🧹 Preview Worker Cleaned Up\n\n' +
              'Worker `' + workerName + '` has been deleted.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
