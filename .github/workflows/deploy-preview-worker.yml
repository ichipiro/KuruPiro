name: Deploy Preview Worker

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-preview-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sanitize branch name
        id: sanitize
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          SANITIZED=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^-\|-$//g')
          echo "branch=$SANITIZED" >> $GITHUB_OUTPUT
          echo "worker_name=kuru-piro-worker-$SANITIZED" >> $GITHUB_OUTPUT

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd api
          # Deploy with custom name for branch-specific worker
          pnpm wrangler deploy --name ${{ steps.sanitize.outputs.worker_name }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const workerName = '${{ steps.sanitize.outputs.worker_name }}';
            const workerUrl = `https://${workerName}.workers.dev`;
            const body = `### 🚀 Preview Worker Deployed

Worker Name: \`${workerName}\`
Worker URL: ${workerUrl}

**Test the API:**
\`\`\`bash
curl "${workerUrl}/api/trips?origin=22030_2&destination=51240_"
\`\`\`

This preview worker will be automatically deleted when the PR is closed.`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Worker Deployed')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
